name: Release to Google Play

# Run from the Actions tab: "Release to Google Play" -> Run workflow.
# Builds a signed app bundle from main and uploads it to the chosen track.
# Needs the secrets described in RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: "Release status (use draft until the app has had a first release on the track)"
        type: choice
        options: [completed, draft]
        default: completed
      build_number:
        description: "Version code (blank = 100 + this workflow's run number)"
        required: false

permissions:
  contents: read

concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true

      - name: Check secrets are set
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 is not set (see RELEASING.md)"; exit 1; }
          [ -n "$PLAY" ] || { echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set (see RELEASING.md)"; exit 1; }

      - name: Set up the upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Work out the version code
        id: version
        env:
          INPUT: ${{ inputs.build_number }}
        run: |
          code="${INPUT:-$((100 + ${{ github.run_number }}))}"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Version $(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//') ($code)" >> "$GITHUB_STEP_SUMMARY"

      - run: flutter pub get
      - run: flutter test

      - name: Build the app bundle
        run: flutter build appbundle --release --build-number=${{ steps.version.outputs.code }}

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.k1glv.wavelogportable
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}

      - name: Keep the bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.code }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" android/key.properties
